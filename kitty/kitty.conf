# --- Font ---
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# --- Window ---
window_padding_width 6 4
# Vertical / horizontal: window_padding_width 12 18
confirm_os_window_close 0

# --- Cursor ---
cursor_shape          beam
cursor_blink_interval 0

# --- Misc ---
enable_audio_bell no
background_opacity 1.0
scrollback_lines 5000
copy_on_select clipboard

# --- Colors (monochrome) ---
foreground            #d0d0d0
background            #000000
selection_foreground  #0d0d0d
selection_background  #b0b0b0
cursor                #e0e0e0
cursor_text_color     #0d0d0d
url_color             #b0b0b0

active_border_color   #808080
inactive_border_color #2a2a2a

